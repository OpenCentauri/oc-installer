name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        type: string
        default: 'main'
      version:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
      actions: read
      pull-requests: write
    with:
      ref: ${{ inputs.branch || github.sha }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download CC1 release zip
        uses: actions/download-artifact@v4
        with:
          pattern: oc-installer.zip
          path: artifacts

      - name: Download C2/CC2 zip.sig artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-c*2
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ needs.build.outputs.commit }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: false
          generate_release_notes: false
          files: artifacts/**/*
          fail_on_unmatched_files: true

      - name: Attest Release
        uses: actions/attest@v2
        with:
          subject-path: artifacts/**/*
          predicate-type: 'https://in-toto.io/attestation/release/v0.1'
          predicate: |
            {
              "version": ${{ toJSON(inputs.version || github.ref_name) }},
              "commit": ${{ toJSON(needs.build.outputs.commit) }},
              "branch": ${{ toJSON(inputs.branch || github.ref_name) }}
            }
