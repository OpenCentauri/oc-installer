name: Build installer zip

on:
  workflow_call:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Package installer
        run: |
          wget -O install_opencentauri/decrypt https://github.com/OpenCentauri/OpenCentauri/releases/download/v0.0.0/decrypt
          wget -O install_opencentauri/recovery https://github.com/OpenCentauri/OpenCentauri/releases/download/v1.1.0/recovery
          wget -O install_opencentauri/wifi-network-config-tool https://github.com/OpenCentauri/OpenCentauri/releases/latest/download/wifi-network-config-tool-linux-armv7
          wget -O install_opencentauri/utf8-fix https://github.com/OpenCentauri/OpenCentauri/releases/latest/download/utf8-fix-linux-armv7
          zip -r oc-installer.zip install_opencentauri
      
      - uses: actions/upload-artifact@v4
        with:
          name: installer-cc1
          path: oc-installer.zip

      - name: Package C2/CC2 installers
        run: |
          ./build.sh
          zip -r installer-cc2.zip install_c2 build/cc2_eeb001_installer_*.zip.sig
          zip -r installer-c2.zip install_c2 build/c2_eeb001_installer_*.zip.sig

      - uses: actions/upload-artifact@v4
        with:
          name: installer-cc2
          path: installer-cc2.zip

      - uses: actions/upload-artifact@v4
        with:
          name: installer-c2
          path: installer-c2.zip

  comment:
    needs: build
    if: github.event_name == 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get workflow run info
        id: run_info
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha.substring(0, 7);
            const branch = context.payload.pull_request.head.ref;

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let artifactRows = '';
            for (const artifact of artifacts.data.artifacts) {
              const sizeMB = (artifact.size_in_bytes / (1024 * 1024)).toFixed(2);
              const artifactUrl = `${runUrl}/artifacts/${artifact.id}`;
              artifactRows += `| [${artifact.name}](${artifactUrl}) | ${sizeMB} MB |\n`;
            }

            if (!artifactRows) {
              artifactRows = '| _No artifacts uploaded_ | - |\n';
            }

            const body = `## ✅ Build Artifacts\n\n` +
              `**Branch:** \`${branch}\`\n` +
              `**Build:** \`${headSha}\` (merge into \`${context.payload.pull_request.base.ref}\`)\n\n` +
              `| Artifact | Size |\n` +
              `| --- | --- |\n` +
              artifactRows + `\n` +
              `[View workflow run](${runUrl})`;

            core.setOutput('body', body);

      - name: Post PR comment
        uses: peter-evans/create-or-update-comment@v4
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.run_info.outputs.body }}
