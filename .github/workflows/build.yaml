name: Build installer zip

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
    outputs:
      commit:
        value: ${{ jobs.build.outputs.commit }}
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf busybox shellcheck

      - name: Cache pigz build
        uses: actions/cache@v4
        with:
          path: build/pigz
          key: pigz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-pigz.sh') }}

      - name: Cache curl build
        uses: actions/cache@v4
        with:
          path: build/curl
          key: curl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-curl.sh') }}

      - name: Cache fetched ARM helpers
        uses: actions/cache@v4
        with:
          path: |
            build/recovery
            build/bind-shell
          key: fetch-${{ runner.os }}-${{ hashFiles('tools/fetch-binaries.sh') }}

      - name: Build all installers
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installer-cc1
          path: build/cc1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: oc-installer.zip
          path: build/oc-installer.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: installer-cc2
          path: build/cc2_eeb001_*.zip.sig
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: installer-c2
          path: build/c2_eeb001_*.zip.sig
          if-no-files-found: error

  comment:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const marker = '<!-- installer-artifacts -->';
            const issue = {...context.repo, issue_number: context.issue.number};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: {artifacts}} = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: context.runId,
            });
            const links = artifacts.filter(a => a.name.startsWith('installer-'))
              .map(a => `- [${a.name}](${runUrl}/artifacts/${a.id})`).join('\n');
            const body = `${marker}\n## Build artifacts\n\n` +
              `Build: \`${context.payload.pull_request.head.sha.slice(0, 7)}\`\n\n` +
              `${links}\n\n[View workflow run](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...issue, body});
            }
